spring:
  application:
    name: portal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DATABASE_USERNAME:portal}
    password: ${DATABASE_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Em produção o Render define JWT_SECRET. O valor padrão serve só na sua máquina.
    secret: ${JWT_SECRET:dev-somente-local-troque-em-producao-0123456789abcdef}
    validade: P10D
